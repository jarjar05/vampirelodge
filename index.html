<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF5EC" />
    <meta name="description" content="A shared family care coordination dashboard." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffe3c4'/%3E%3Cpath d='M0 46 C16 38 32 40 64 44 V64 H0 Z' fill='%239fc4a3'/%3E%3Ccircle cx='32' cy='26' r='11' fill='%23f6a945'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Light or dark, chosen before the page draws so it never flashes the wrong one. Follows the device until the person picks.
      try {
        var saved = localStorage.getItem("lodge-theme");
        document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch (error) { document.documentElement.dataset.theme = "light"; }
    </script>
    <title>Family Care Coordinator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
