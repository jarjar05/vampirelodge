services:
  db:
    image: postgres:17-alpine
    container_name: family-care-postgres-project
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familycare}
      POSTGRES_DB: ${POSTGRES_DB:-family_care}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familycare} -d ${POSTGRES_DB:-family_care}"]
      interval: 5s
      timeout: 3s
      retries: 10